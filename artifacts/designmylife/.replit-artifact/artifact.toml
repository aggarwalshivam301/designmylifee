kind = "web"
previewPath = "/"
title = "DesignMyLife"
version = "1.0.0"
id = "artifacts/designmylife"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21097

[services.development]
run = "pnpm --filter @workspace/designmylife run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/designmylife", "run", "build" ]
publicDir = "artifacts/designmylife/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21097"
BASE_PATH = "/"
